server:
  port: 8081
  shutdown: graceful
  tomcat:
    max-swallow-size: 300MB

spring:
  application:
    name: blued-api
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:blued}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:blued123456}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 420MB
  jackson:
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blued:
  jwt:
    secret: ${JWT_SECRET:blued-blueshield-default-secret-key-please-change-2025}
    expire-hours: 8
  upload:
    dir: ${UPLOAD_DIR:/data/upload}
    max-size-mb: 200
  init:
    admin-password: ${ADMIN_PASSWORD:Admin@Blued2025}

logging:
  level:
    root: info
    com.blued: info
